<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sites</title>
    <style>
      /*
       * 视觉对齐 Sites 面板原型（卡片、分体按钮、阶段条、日志区）。颜色、字体、圆角只取宿主下发的
       * MCP Apps 标准变量（hostContext.styles.variables），这里给兜底值；宽窄布局用容器查询。
       */
      :root {
        color-scheme: light dark;
        --fg: var(--color-text-primary, #404040);
        --subtle: var(--color-text-secondary, #737373);
        --subtlest: var(--color-text-tertiary, #a3a3a3);
        --bg: var(--color-background-primary, #fff);
        --panel: var(--color-background-secondary, #f5f5f5);
        --surface: var(--color-background-tertiary, #ededed);
        --hover: var(--color-background-ghost, #e5e5e5);
        --border: var(--color-border-primary, rgba(10, 10, 10, 0.1));
        --border-hover: var(--color-border-secondary, rgba(10, 10, 10, 0.2));
        --card-border: var(--color-border-tertiary, rgba(10, 10, 10, 0.1));
        --primary: var(--color-background-inverse, #0a0a0a);
        --primary-fg: var(--color-text-inverse, #fafafa);
        --danger: var(--color-text-danger, #dc2626);
        --success: var(--color-text-success, #16a34a);
        --warning: var(--color-text-warning, #ca8a04);
        --ring: var(--color-ring-primary, #38bdf8);
        --text-xs: var(--font-text-xs-size, 11px);
        --text-sm: var(--font-text-sm-size, 12px);
        --text-base: var(--font-text-md-size, 14px);
        --text-lg: var(--font-text-lg-size, 16px);
        --text-xl: var(--font-heading-sm-size, 18px);
        --radius-md: var(--border-radius-md, 6px);
        --radius-lg: var(--border-radius-lg, 8px);
        --radius-xl: var(--border-radius-xl, 12px);
        --medium: var(--font-weight-medium, 500);
        --semibold: var(--font-weight-semibold, 600);
        --mono: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
      }
      body {
        font: var(--text-base) / 1.5 var(--font-sans, system-ui, sans-serif);
        -webkit-font-smoothing: antialiased;
      }
      button,
      input {
        font: inherit;
        color: inherit;
      }
      h1,
      h2,
      h3,
      p,
      dl,
      dd,
      ul,
      ol {
        margin: 0;
        padding: 0;
      }
      ul,
      ol {
        list-style: none;
      }
      h1 {
        font-size: var(--text-lg);
        font-weight: var(--semibold);
        line-height: 1.4;
        min-width: 0;
      }
      h2,
      h3 {
        font-size: var(--text-base);
        font-weight: var(--medium);
      }
      svg {
        width: 16px;
        height: 16px;
        flex: none;
      }
      :focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 1px;
      }

      /* ---------- 布局 ---------- */
      .shell {
        display: flex;
        flex-direction: column;
        height: 100%;
        container: sites / inline-size;
      }
      .scroll {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        scrollbar-gutter: stable;
      }
      .page {
        max-width: 768px;
        margin: 0 auto;
        padding: 16px;
      }
      .stack-1 > * + * {
        margin-top: 4px;
      }
      .stack-2 > * + * {
        margin-top: 8px;
      }
      .stack-3 > * + * {
        margin-top: 12px;
      }
      .stack-4 > * + * {
        margin-top: 16px;
      }
      .stack-5 > * + * {
        margin-top: 20px;
      }
      .row {
        display: flex;
        align-items: center;
        min-width: 0;
      }
      .between {
        justify-content: space-between;
        gap: 12px;
      }
      .gap-1 {
        gap: 4px;
      }
      .gap-2 {
        gap: 8px;
      }
      .gap-3 {
        gap: 12px;
      }
      .wrap-row {
        flex-wrap: wrap;
        row-gap: 4px;
      }
      .grow {
        flex: 1;
      }
      .truncate {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .wrap {
        overflow-wrap: anywhere;
      }
      .subtle {
        color: var(--subtle);
      }
      .subtlest {
        color: var(--subtlest);
      }
      .sm {
        font-size: var(--text-sm);
      }
      .strong {
        font-weight: var(--medium);
      }
      .mono {
        font-family: var(--mono);
      }
      .danger {
        color: var(--danger);
      }
      .title-row {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      .count,
      .tab-count {
        color: var(--subtlest);
        font-size: var(--text-sm);
        font-variant-numeric: tabular-nums;
      }
      .loading {
        display: grid;
        place-items: center;
        padding: 48px 0;
        color: var(--subtle);
      }
      .spin {
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spin,
        .pulse {
          animation: none;
        }
      }

      /* ---------- 按钮 ---------- */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 32px;
        padding: 0 10px;
        border: 1px solid transparent;
        border-radius: var(--radius-lg);
        background: none;
        font-size: var(--text-base);
        white-space: nowrap;
        cursor: pointer;
      }
      .btn.sm {
        height: 28px;
        padding: 0 8px;
        font-size: var(--text-sm);
      }
      .btn.lg {
        height: 32px;
        padding: 0 12px;
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .btn.primary {
        background: var(--primary);
        color: var(--primary-fg);
      }
      .btn.primary:not(:disabled):hover {
        opacity: 0.9;
      }
      .btn.outline {
        border-color: var(--border);
        background: var(--bg);
      }
      .btn.outline:not(:disabled):hover,
      .btn.ghost:not(:disabled):hover {
        background: var(--hover);
      }
      .btn.ghost {
        color: var(--subtle);
      }
      .btn.back {
        margin-left: -8px;
      }
      .btn.center {
        display: flex;
        margin: 8px auto 0;
      }
      .icon-btn {
        display: inline-grid;
        place-items: center;
        flex: none;
        width: 32px;
        height: 32px;
        border: 0;
        border-radius: var(--radius-lg);
        background: none;
        color: var(--subtle);
        cursor: pointer;
      }
      .icon-btn.sm {
        width: 26px;
        height: 26px;
        margin: -4px 0;
      }
      .icon-btn.sm svg {
        width: 14px;
        height: 14px;
      }
      .icon-btn:not(:disabled):hover {
        background: var(--hover);
        color: var(--fg);
      }
      .icon-btn:disabled {
        opacity: 0.4;
        cursor: default;
      }

      /* 分体按钮：主按钮复制首条命令，右侧箭头展开菜单。 */
      .menu-anchor {
        position: relative;
        flex: none;
      }
      .split {
        display: inline-flex;
        align-items: center;
        height: 32px;
        border-radius: var(--radius-lg);
      }
      .split.primary {
        background: var(--primary);
        color: var(--primary-fg);
      }
      .split.outline {
        border: 1px solid var(--border);
        background: var(--bg);
      }
      .split button {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 100%;
        border: 0;
        background: none;
        color: inherit;
        cursor: pointer;
      }
      .split-main {
        padding: 0 10px 0 12px;
        border-radius: var(--radius-lg) 0 0 var(--radius-lg);
      }
      .split-toggle {
        padding: 0 8px;
        border-radius: 0 var(--radius-lg) var(--radius-lg) 0;
      }
      .split-toggle svg {
        width: 14px;
        height: 14px;
      }
      .split.primary button:not(:disabled):hover {
        background: color-mix(in srgb, var(--primary-fg) 12%, transparent);
      }
      .split.outline button:not(:disabled):hover {
        background: var(--hover);
      }
      .split button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .split-divider {
        width: 1px;
        height: 16px;
        background: currentColor;
        opacity: 0.2;
      }
      .popover {
        position: absolute;
        right: 0;
        top: calc(100% + 6px);
        z-index: 10;
        width: 320px;
        max-width: calc(100vw - 32px);
        padding: 6px;
        border: 1px solid var(--border);
        border-radius: var(--radius-xl);
        background: var(--bg);
        box-shadow: var(--shadow-lg, 0 10px 15px -3px rgba(0, 0, 0, 0.1));
      }
      .popover-hint {
        padding: 6px 8px 8px;
        color: var(--subtle);
        font-size: var(--text-sm);
      }
      .menu-item {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 8px;
        border: 0;
        border-radius: var(--radius-md);
        background: none;
        text-align: left;
        cursor: pointer;
      }
      .menu-item:hover {
        background: var(--hover);
      }
      .menu-item-text {
        display: grid;
        gap: 2px;
        flex: 1;
        min-width: 0;
      }
      .menu-item code {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--subtle);
        font: var(--text-sm) / 1.4 var(--mono);
      }
      .menu-item-icon {
        width: 14px;
        height: 14px;
        color: var(--subtlest);
      }

      /* ---------- 卡片 ---------- */
      .card {
        border: 1px solid var(--card-border);
        border-radius: var(--radius-xl);
        background: var(--bg);
      }
      .cards > * + * {
        margin-top: 8px;
      }
      .dashed {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 24px 16px;
        border: 1px dashed var(--border);
        border-radius: var(--radius-xl);
        color: var(--subtle);
        font-size: var(--text-sm);
        text-align: center;
      }
      .dashed-icon {
        color: var(--subtlest);
      }
      .empty {
        display: grid;
        justify-items: center;
        gap: 8px;
        padding: 56px 24px;
        border: 1px dashed var(--border);
        border-radius: var(--radius-xl);
        text-align: center;
        font-size: var(--text-sm);
      }
      .empty-icon {
        width: 24px;
        height: 24px;
        color: var(--subtlest);
      }
      .empty-title {
        font-size: var(--text-base);
        font-weight: var(--medium);
      }
      .search {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 32px;
        padding: 0 10px;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        color: var(--subtlest);
      }
      .search:focus-within {
        border-color: var(--border-hover);
      }
      .search input {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: 0;
        background: none;
        color: var(--fg);
      }
      .search input::placeholder,
      .input::placeholder {
        color: var(--subtlest);
      }

      .site-card {
        display: flex;
        align-items: center;
        gap: 4px;
        padding-right: 8px;
        transition: background-color 0.15s;
      }
      .site-card:hover {
        background: var(--hover);
      }
      .site-main {
        display: flex;
        align-items: center;
        gap: 16px;
        flex: 1;
        min-width: 0;
        padding: 12px 8px 12px 16px;
        border: 0;
        border-radius: var(--radius-xl);
        background: none;
        text-align: left;
        cursor: pointer;
      }
      /* 封面：640×400 的首页截图，按 16:10 显示，裁掉多余部分时保留页面顶部。只在列表卡片显示，窄面板不显示。 */
      .cover {
        display: none;
        flex-shrink: 0;
        align-items: center;
        justify-content: center;
        width: 112px;
        aspect-ratio: 16 / 10;
        overflow: hidden;
        border: 1px solid var(--card-border);
        border-radius: var(--radius-lg);
        background: var(--surface);
      }
      .cover img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top;
      }
      .cover-icon {
        width: 20px;
        height: 20px;
        color: var(--subtlest);
      }
      @container sites (min-width: 340px) {
        .site-card .cover {
          display: flex;
        }
        .site-card .site-main {
          padding-left: 8px;
        }
      }
      @container sites (min-width: 480px) {
        .site-card .cover {
          width: 144px;
        }
      }
      .site-text {
        display: grid;
        gap: 2px;
        flex: 1;
        min-width: 0;
      }
      .site-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: var(--medium);
      }
      .site-host {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--subtle);
        font-size: var(--text-sm);
      }
      .row-card {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 12px;
        text-align: left;
        cursor: pointer;
        transition: background-color 0.15s;
      }
      .row-card:hover {
        border-color: var(--border-hover);
        background: var(--hover);
      }
      .row-card-text {
        display: grid;
        gap: 2px;
        flex: 1;
        min-width: 0;
      }
      .chevron {
        color: var(--subtlest);
      }
      .tag {
        flex: none;
        padding: 1px 6px;
        border-radius: var(--radius-md);
        background: var(--surface);
        color: var(--subtle);
        font-size: var(--text-xs);
        font-weight: var(--medium);
      }

      /* 元信息用 · 分隔；每项左侧负外边距吃掉分隔点，换行后的行首就不会留下孤立的点。 */
      .meta-wrap {
        display: block;
        min-width: 0;
        overflow: hidden;
      }
      .meta {
        display: flex;
        flex-wrap: wrap;
        margin-left: -16px;
        color: var(--subtle);
        font-size: var(--text-sm);
      }
      .meta-item {
        display: inline-flex;
        align-items: center;
        min-width: 0;
      }
      .meta-item::before {
        content: "·";
        width: 16px;
        text-align: center;
        color: var(--subtlest);
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }
      .status.danger {
        color: var(--danger);
      }
      .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--subtlest);
      }
      .status.success .status-dot {
        background: var(--success);
      }
      .status.danger .status-dot {
        background: var(--danger);
      }
      .status-spin {
        width: 12px;
        height: 12px;
      }
      .phase-icon {
        display: grid;
        place-items: center;
        flex: none;
        width: 32px;
        height: 32px;
        border-radius: var(--radius-lg);
        background: var(--surface);
        color: var(--subtle);
      }
      .phase-icon.success {
        color: var(--success);
      }
      .phase-icon.danger {
        color: var(--danger);
      }

      .alert {
        display: flex;
        gap: 12px;
        padding: 12px 16px;
        border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent);
        border-radius: var(--radius-xl);
        background: color-mix(in srgb, var(--danger) 5%, transparent);
        font-size: var(--text-sm);
      }
      .alert-icon {
        margin-top: 1px;
        color: var(--danger);
      }
      .alert-body {
        flex: 1;
        min-width: 0;
      }
      .alert-body > * + * {
        margin-top: 4px;
      }
      .alert-title {
        color: var(--danger);
        font-weight: var(--medium);
      }

      .usage-bar {
        flex: none;
        border-top: 1px solid var(--border);
        background: var(--bg);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .usage-bar-inner {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 12px;
        max-width: 768px;
        height: 40px;
        margin: 0 auto;
        padding: 0 16px;
      }
      .usage-bar-text {
        display: none;
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--subtle);
        font-size: var(--text-sm);
      }
      .usage-bar.danger .usage-bar-text {
        color: var(--danger);
      }
      .wide-only {
        display: none;
      }
      @container sites (min-width: 420px) {
        .usage-bar-text {
          display: block;
        }
      }
      @container sites (min-width: 640px) {
        .wide-only {
          display: inline;
        }
      }

      /* ---------- 站点详情 ---------- */
      .crumbs {
        display: flex;
        align-items: center;
        gap: 4px;
        min-width: 0;
        color: var(--subtle);
        font-size: var(--text-sm);
      }
      .crumbs .truncate {
        padding: 0 4px;
      }
      /* 窄面板下操作按钮换到标题下方，避免把标题挤成逐字折行。 */
      .site-head {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .site-head-text {
        flex: 1;
        min-width: 0;
      }
      .site-head-text > * + * {
        margin-top: 6px;
      }
      .head-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        flex: none;
      }
      /* 窄面板下按钮在标题下方靠左，菜单跟着左对齐，否则会伸出面板左边。 */
      .head-actions .popover {
        right: auto;
        left: 0;
      }
      @container sites (min-width: 520px) {
        .head-actions .popover {
          right: 0;
          left: auto;
        }
        .site-head {
          flex-direction: row;
          align-items: flex-start;
          justify-content: space-between;
          gap: 16px;
        }
      }
      .tabs {
        display: flex;
        gap: 16px;
        border-bottom: 1px solid var(--border);
      }
      .tab {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 36px;
        margin-bottom: -1px;
        padding: 0;
        border: 0;
        border-bottom: 2px solid transparent;
        background: none;
        color: var(--subtle);
        font-weight: var(--medium);
        cursor: pointer;
      }
      .tab:hover {
        color: var(--fg);
      }
      .tab.active {
        border-bottom-color: var(--fg);
        color: var(--fg);
      }
      .fields {
        display: grid;
        gap: 12px;
        padding: 12px 16px;
      }
      @container sites (min-width: 560px) {
        .fields {
          grid-template-columns: 2fr 1fr;
          gap: 16px;
        }
      }
      .field {
        display: grid;
        gap: 2px;
        min-width: 0;
      }
      .field dd {
        min-width: 0;
      }
      .setting {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 16px;
      }
      .setting-text {
        min-width: 0;
      }
      .setting-title {
        font-weight: var(--medium);
      }
      .card-foot {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        border-top: 1px solid var(--border);
        color: var(--subtle);
        font-size: var(--text-sm);
      }
      .card-foot.danger {
        color: var(--danger);
      }
      .card-foot .tag {
        color: var(--fg);
      }
      .foot-icon {
        width: 14px;
        height: 14px;
        color: var(--subtlest);
      }
      .switch {
        position: relative;
        flex: none;
        width: 32px;
        height: 18px;
        margin-top: 2px;
        padding: 0;
        border: 0;
        border-radius: 999px;
        background: var(--border-hover);
        cursor: pointer;
        transition: background-color 0.15s;
      }
      .switch[aria-checked="true"] {
        background: var(--primary);
      }
      .switch:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .switch-thumb {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--bg);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        transition: transform 0.15s;
      }
      .switch[aria-checked="true"] .switch-thumb {
        transform: translateX(14px);
      }

      /* ---------- 部署详情 ---------- */
      .deployment-title {
        min-width: 0;
        font-size: var(--text-lg);
        font-weight: var(--semibold);
      }
      /* gap + 背景色画单元格分隔线，不出现双线。 */
      .grid-cells {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1px;
        overflow: hidden;
        border: 1px solid var(--card-border);
        border-radius: var(--radius-xl);
        background: var(--border);
      }
      .cell {
        display: grid;
        gap: 4px;
        min-width: 0;
        padding: 12px 16px;
        background: var(--bg);
      }
      .logs-card {
        overflow: hidden;
      }
      .logs-head {
        padding: 12px 16px;
      }
      .logs-head > * + * {
        margin-top: 12px;
      }
      .steps {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px 8px;
      }
      @container sites (min-width: 480px) {
        .steps {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }
      .step {
        display: grid;
        gap: 8px;
        min-width: 0;
        color: var(--subtlest);
        font-size: var(--text-sm);
      }
      .step-bar {
        height: 2px;
        border-radius: 1px;
        background: var(--border);
      }
      .step.done .step-bar {
        background: var(--success);
      }
      .step.active .step-bar {
        background: var(--subtle);
      }
      .step.failed .step-bar {
        background: var(--danger);
      }
      .step.done,
      .step.active {
        color: var(--fg);
      }
      .step.failed {
        color: var(--danger);
      }
      .step-label {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      .step-icon {
        width: 14px;
        height: 14px;
      }
      .step.done .step-icon {
        color: var(--success);
      }
      .step-dot {
        flex: none;
        width: 6px;
        height: 6px;
        margin: 0 4px;
        border-radius: 50%;
        background: var(--border-hover);
      }
      .logs-wrap {
        position: relative;
        border-block: 1px solid var(--border);
        background: var(--panel);
      }
      .logs {
        height: 384px;
        max-height: 60vh;
        overflow: auto;
        padding: 8px 0;
        font: var(--text-sm) / 1.7 var(--mono);
      }
      .logs-empty {
        padding: 0 16px;
        color: var(--subtlest);
      }
      .log {
        display: flex;
        gap: 16px;
        padding: 0 16px;
      }
      .log:hover {
        background: var(--hover);
      }
      .log-time {
        flex: none;
        color: var(--subtlest);
        font-variant-numeric: tabular-nums;
        user-select: none;
      }
      .log-message {
        flex: 1;
        min-width: 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .log.warn .log-message {
        color: var(--warning);
      }
      .log.error .log-message {
        color: var(--danger);
      }
      .jump {
        position: absolute;
        right: 16px;
        bottom: 12px;
        box-shadow: var(--shadow-md, 0 4px 6px -1px rgba(0, 0, 0, 0.1));
      }
      .logs-foot {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        color: var(--subtlest);
        font-size: var(--text-sm);
      }
      .pulse {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--subtle);
        animation: pulse 1.5s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.3;
        }
      }

      /* ---------- 改名对话框 ---------- */
      .overlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        padding: 16px;
        background: rgba(0, 0, 0, 0.4);
      }
      .dialog {
        display: grid;
        gap: 16px;
        width: 100%;
        max-width: 420px;
        padding: 20px;
        border: 1px solid var(--border);
        border-radius: var(--radius-xl);
        background: var(--bg);
        box-shadow: var(--shadow-lg, 0 10px 15px -3px rgba(0, 0, 0, 0.1));
      }
      .dialog h2 {
        font-size: var(--text-lg);
        font-weight: var(--semibold);
      }
      .field-label {
        display: block;
        font-size: var(--text-sm);
        font-weight: var(--medium);
      }
      .input {
        width: 100%;
        height: 36px;
        padding: 0 10px;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background: var(--bg);
      }
      .input:focus {
        border-color: var(--border-hover);
        outline: 0;
      }
      .inline-icon {
        width: 14px;
        height: 14px;
        color: var(--subtlest);
      }
      .dialog-foot {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }

      /* ---------- 用量 ---------- */
      .meters {
        display: grid;
        gap: 12px;
      }
      @container sites (min-width: 420px) {
        .meters {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @container sites (min-width: 720px) {
        .meters {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }
      .meter {
        display: grid;
        gap: 12px;
        padding: 16px;
      }
      .meter-icon {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border-radius: var(--radius-lg);
        background: var(--panel);
        color: var(--subtle);
      }
      .meter-value {
        font-variant-numeric: tabular-nums;
      }
      .meter-value span {
        white-space: nowrap;
      }
      .big {
        font-size: var(--text-xl);
        font-weight: var(--semibold);
      }
      .meter-track {
        flex: 1;
        height: 6px;
        overflow: hidden;
        border-radius: 999px;
        /* 宿主的次级背景在浅色主题下接近白色，轨道用边框色才看得见。 */
        background: var(--border);
      }
      .meter-fill {
        height: 100%;
        border-radius: 999px;
        background: var(--subtle);
      }
      .meter-track.danger .meter-fill {
        background: var(--danger);
      }
      .meter-percent {
        width: 40px;
        color: var(--subtle);
        font-size: var(--text-sm);
        font-variant-numeric: tabular-nums;
        text-align: right;
      }

      /* 套餐额度与权益：每个档位一张卡，指标纵向排列；当前档位边框加深。 */
      .plans {
        display: grid;
        gap: 12px;
      }
      @container sites (min-width: 420px) {
        .plans {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @container sites (min-width: 720px) {
        .plans {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }
      .plan {
        display: grid;
        align-content: start;
        gap: 20px;
        min-width: 0;
        padding: 16px;
      }
      .plan.current {
        border-color: var(--border-hover);
        background: var(--panel);
      }
      .plan-name {
        font-size: var(--text-lg);
        font-weight: var(--semibold);
      }
      .plan-limits {
        display: grid;
        gap: 16px;
      }
      .plan-limits > div > * + * {
        margin-top: 4px;
      }
      .plan-value {
        font-weight: var(--medium);
        font-variant-numeric: tabular-nums;
      }

      /* ---------- 状态页与提示 ---------- */
      .state-page {
        display: grid;
        place-items: center;
        align-content: center;
        gap: 12px;
        height: 100%;
        padding: 24px;
        text-align: center;
        color: var(--subtle);
      }
      .state-icon {
        width: 24px;
        height: 24px;
        color: var(--subtlest);
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 56px;
        z-index: 30;
        max-width: calc(100vw - 32px);
        padding: 8px 12px;
        border-radius: var(--radius-lg);
        background: var(--primary);
        color: var(--primary-fg);
        font-size: var(--text-sm);
        transform: translateX(-50%);
        box-shadow: var(--shadow-md, 0 4px 6px -1px rgba(0, 0, 0, 0.1));
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      /*__SCRIPT__*/
    </script>
  </body>
</html>
